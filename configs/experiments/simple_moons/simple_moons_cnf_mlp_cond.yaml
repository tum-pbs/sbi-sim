name: CNF_MLP_COND

training:
  num_epochs: 100
  num_steps_per_epoch: 1000
  batch_size: &batch_size 256

optimization:
  _file: configs/optimization/adamw.yaml

data:
  num_features: &num_features 2
  batch_size: *batch_size
  _file: configs/datasets/simple_moons_class.yaml

model:
  target: flows.ffjord.StackedFFJORD
  params:
    dim_flow: *num_features
    dim_conditioning: 1
    import_samples: 8
    mode: approx
    stepsize_controller_name: constant
    solver_name: tsit5
    steps: 2
    width_size: 64
    depth: 3

callbacks:
  _file: configs/callbacks/default_callbacks.yaml
  plots:
    target: callbacks.moons_simple.SimpleMoonDatasetPlotsConditional
    params:



