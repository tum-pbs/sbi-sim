name: NSF_CL
seed: ${runtime.seed}

training:

  num_epochs: 100
  num_steps_per_epoch: 1000
  batch_size: &batch_size 256

optimization:

  optimizer:
    target: optimization.adam.AdamStax
    params:

  scheduler:
    target: optimization.schedules.constant_schedule
    params:
      lr: 1e-4

data:

  num_features: &num_features 2

  train:

    target: data.moons_simple.SimpleMoonsDataLoader
    params:
      seed: 0
      num_samples: 10000
      num_steps: 1000
      batch_size: *batch_size
      shuffle: True

  val:

    target: data.moons_simple.SimpleMoonsDataLoader
    params:
      seed: 1
      num_samples: 2000
      num_steps: 100
      batch_size: *batch_size
      shuffle: False

model:

  target: flows.nsf.StackedNSF_CL
  params:
    steps: 6
    dim_flow: *num_features
    dim_conditioning: 0
    hidden_dim: 128
    B: 4
    import_samples: 8

callbacks:

  callback1:
    target: callbacks.datasetcheck.DatasetCheck
    params:
  callback2:
    target: callbacks.flowcheck.FlowCheck
    params:
  callback3:
    target: callbacks.moons_simple.SimpleMoonDatasetPlots
    params:
  callback4:
    target: callbacks.checkpoint.Checkpoint
    params:
      savedir: ${runtime.logdir}
      key: val_loss



