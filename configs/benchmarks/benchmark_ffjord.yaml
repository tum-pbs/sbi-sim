strategy:
  target: strategy.NeuralPosteriorEstimation
  params:
    model:
      target: flows.ffjord.StackedFFJORD
      params:
        dim_flow: ${dim_flow}
        dim_conditioning: ${dim_conditioning}
        import_samples: 8
        mode: exact
        init_stepsize: 0.1
        stepsize_controller_name: constant
        solver_name: tsit5
        steps: 1
        width_size: 256
        depth: 6

training:
  num_epochs: 100
  num_steps_per_epoch: 1000
  batch_size: ${batch_size}

test:
  active: True
  tests:
    c2st:
      target: callbacks.C2ST

optimization:
  _file: configs/optimization/adamw.yaml

callbacks:
  _file: configs/callbacks/default_callbacks.yaml
  scatter:
    target: callbacks.BenchmarkScatterPlot
    params:
      save_every: 10